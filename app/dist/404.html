<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scan &amp; Print</title>
  <script>
    (function() {
      var l = window.location;
      var path = l.pathname.replace(/^\/+/, '');
      var target = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(path) + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      l.replace(target);
    })();
  </script>
</head>
<body>
</body>
</html>
